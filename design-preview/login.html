<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OpsPilot 设计预览 - 登录页</title>
<style>
  :root {
    --primary: #2563EB; --primary-hover: #1D4ED8;
    --text-1: #0F172A; --text-2: #475569; --text-3: #94A3B8;
    --border: #E2E8F0; --success: #16A34A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text-1); font-size: 14px;
  }
  .page { display: flex; min-height: 100vh; }

  /* ===== 左侧品牌区（55%）===== */
  .brand {
    flex: 1.2; position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(145deg, #1E3A8A 0%, #1D4ED8 45%, #3B82F6 100%);
    display: flex; flex-direction: column; justify-content: center; padding: 72px;
  }
  /* 装饰：网格 + 光斑 + 圆环 */
  .brand::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 44px 44px; }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); }
  .glow.a { width: 420px; height: 420px; background: rgba(96,165,250,.4); top: -120px; right: -100px; }
  .glow.b { width: 340px; height: 340px; background: rgba(30,58,138,.55); bottom: -100px; left: -80px; }
  .ring { position: absolute; border: 1.5px solid rgba(255,255,255,.14); border-radius: 50%; }
  .ring.a { width: 300px; height: 300px; bottom: 8%; right: 6%; }
  .ring.b { width: 180px; height: 180px; bottom: 16%; right: 13%; border-style: dashed; }

  .brand-inner { position: relative; z-index: 1; max-width: 480px; }
  .brand-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }
  .brand-logo .ic { width: 44px; height: 44px; border-radius: 13px;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
  .brand-logo .ic svg { width: 22px; height: 22px; fill: #fff; }
  .brand-logo b { font-size: 20px; letter-spacing: .3px; }
  .brand h1 { font-size: 34px; line-height: 1.35; font-weight: 800; margin-bottom: 16px; }
  .brand h1 .hl { color: #93C5FD; }
  .brand p { font-size: 15px; line-height: 1.8; color: rgba(255,255,255,.75); margin-bottom: 44px; }
  .feat { display: flex; flex-direction: column; gap: 16px; }
  .feat-item { display: flex; align-items: center; gap: 12px; font-size: 14px; color: rgba(255,255,255,.9); }
  .feat-item .fi { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center; }
  .feat-item .fi svg { width: 15px; height: 15px; stroke: #BFDBFE; fill: none; stroke-width: 2; }

  /* ===== 右侧表单区 ===== */
  .form-side { flex: 1; background: #F8FAFC; display: flex; align-items: center;
    justify-content: center; padding: 40px; }
  .form-card { width: 400px; background: #fff; border-radius: 20px; padding: 40px;
    box-shadow: 0 1px 3px rgba(16,24,40,.05), 0 20px 48px rgba(16,24,40,.09); }
  .form-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .form-card .sub { font-size: 13px; color: var(--text-3); margin-bottom: 28px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: var(--text-2); }
  .input { display: flex; align-items: center; gap: 10px; height: 44px; border-radius: 11px;
    border: 1.5px solid var(--border); padding: 0 14px; background: #fff; }
  .input.focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .input svg { width: 16px; height: 16px; stroke: var(--text-3); fill: none; stroke-width: 1.8; flex-shrink: 0; }
  .input span { color: var(--text-1); font-size: 14px; }
  .input .ph { color: var(--text-3); }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 22px; }
  .remember { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); }
  .checkbox { width: 16px; height: 16px; border-radius: 5px; background: var(--primary);
    display: flex; align-items: center; justify-content: center; }
  .checkbox svg { width: 10px; height: 10px; stroke: #fff; stroke-width: 3; fill: none; }
  .link { font-size: 13px; color: var(--primary); font-weight: 600; }
  .btn { width: 100%; height: 46px; border: 0; border-radius: 11px; cursor: pointer;
    background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: #fff; font-size: 15px;
    font-weight: 700; letter-spacing: 2px; box-shadow: 0 6px 16px rgba(37,99,235,.35); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0 16px;
    color: var(--text-3); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .sso-row { display: flex; gap: 12px; }
  .sso { flex: 1; height: 40px; border-radius: 10px; border: 1.5px solid var(--border);
    background: #fff; display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 13px; color: var(--text-2); font-weight: 600; cursor: pointer; }
  .sso svg { width: 15px; height: 15px; stroke: var(--text-2); fill: none; stroke-width: 1.8; }
  .foot { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 26px; }
</style>
</head>
<body>
<div class="page">
  <!-- 左侧品牌区 -->
  <div class="brand">
    <div class="glow a"></div><div class="glow b"></div>
    <div class="ring a"></div><div class="ring b"></div>
    <div class="brand-inner">
      <div class="brand-logo">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M13 2L4.09 12.11c-.4.45-.08 1.16.52 1.16H11l-1.5 8.5 9.41-10.11c.4-.45.08-1.16-.52-1.16H13l1.5-8.5z"/></svg></div>
        <b>OpsPilot</b>
      </div>
      <h1>让运维操作<br><span class="hl">标准化 · 可审批 · 可审计</span></h1>
      <p>面向中小团队的自动化运维平台，覆盖资源管理、作业执行、工单审批与安全审计的完整闭环。</p>
      <div class="feat">
        <div class="feat-item"><div class="fi"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg></div>操作全量审计留痕，安全合规有据可查</div>
        <div class="feat-item"><div class="fi"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></div>高危操作强制工单审批，杜绝误操作</div>
        <div class="feat-item"><div class="fi"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></div>作业模板化执行，实时日志全程可控</div>
      </div>
    </div>
  </div>

  <!-- 右侧表单区 -->
  <div class="form-side">
    <div class="form-card">
      <h2>欢迎回来 👋</h2>
      <div class="sub">登录 OpsPilot 运维平台，开始高效运维</div>
      <div class="field">
        <label>账号</label>
        <div class="input focus"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>admin</span></div>
      </div>
      <div class="field">
        <label>密码</label>
        <div class="input"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>••••••••••</span><svg style="margin-left:auto" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
      </div>
      <div class="row">
        <div class="remember"><div class="checkbox"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>记住我</div>
        <span class="link">忘记密码？</span>
      </div>
      <button class="btn">登 录</button>
      <div class="divider">其他登录方式</div>
      <div class="sso-row">
        <div class="sso"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6"/></svg>LDAP</div>
        <div class="sso"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>OIDC SSO</div>
      </div>
      <div class="foot">© 2026 OpsPilot · V1.0 · 建议使用 Chrome / Edge 浏览器</div>
    </div>
  </div>
</div>
</body>
</html>
